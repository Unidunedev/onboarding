name: Validar membros

on:
  pull_request:
    paths:
      - "membros/**"
  push:
    branches: [main]
    paths:
      - "membros/**"

jobs:
  validar:
    name: Conferir os JSONs da pasta membros/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validar-membros
